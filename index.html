<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>K-Experience Match — 기획 와이어프레임</title>
  <style>
    :root{
      --bg:#f8f6fb; --paper:#fff; --ink:#18141f; --muted:#7c7490;
      --primary:#7253f4; --soft:#f0ecff; --pink:#ff6b9d; --line:#ede8f7;
      --ok:#13a660; --shadow:0 8px 24px rgba(50,30,100,.10);
      --anno:#fff9e6; --annoBorder:#f0d060; --annoText:#7a5c00;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(160deg,#ede8ff,#fff 28%);font-family:Inter,Pretendard,"Noto Sans JP",sans-serif;color:var(--ink);font-size:14px}
    .wrap{max-width:1400px;margin:20px auto;padding:0 16px}
    .top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
    .badge{display:inline-block;background:#ede8ff;color:#5638c9;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700}
    h1{margin:6px 0 0;font-size:24px;letter-spacing:-.02em}
    .sub{font-size:12px;color:var(--muted)}
    .layout{display:grid;grid-template-columns:240px 1fr;gap:14px;margin-top:12px}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
    .flows a{display:block;text-decoration:none;color:var(--ink);padding:9px 11px;border-radius:11px;font-weight:600;font-size:13px;border:1px solid transparent;margin-bottom:5px}
    .flows a.on,.flows a:hover{background:#f5f2ff;border-color:#d9d0ff}

    /* ── 3-column view: phone + annotation ── */
    .view{display:grid;grid-template-columns:390px 1fr;gap:16px;align-items:start}

    /* ── phone frame ── */
    .phone{width:390px;border:10px solid #141019;border-radius:40px;overflow:hidden;box-shadow:0 24px 56px rgba(0,0,0,.20)}
    .status{height:28px;background:#0d0b14;color:#fff;padding:6px 14px;font-size:12px;display:flex;justify-content:space-between}
    .screen{height:710px;background:var(--bg);overflow-y:auto;overflow-x:hidden;position:relative}
    .appHead{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .appHead .title{font-size:16px;font-weight:700}
    .appHead .sub{font-size:12px;color:var(--muted)}
    .content{padding:12px}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px}
    .hero{background:linear-gradient(135deg,var(--primary),#9b7ff8);color:#fff;border:none}
    .s{font-size:12px;color:var(--muted)} .hero .s{color:#f0eaff}
    .tag{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:4px 8px;background:var(--soft);color:#5c43d9;margin:2px 3px 2px 0}
    .price{font-weight:800;color:#3d2a9c;font-size:13px}
    .btn{border:0;border-radius:11px;padding:10px 14px;background:var(--primary);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
    .btn.soft{background:var(--soft);color:#5b40d6}
    .btn.full{width:100%;display:block;margin-top:8px}
    .input{width:100%;padding:10px 12px;border:1px solid #ddd7ee;border-radius:11px;background:#fff;font-size:13px;margin:5px 0 8px}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .row{display:flex;gap:8px;align-items:center} .between{justify-content:space-between}
    .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}
    .cat-item{text-align:center;padding:10px 4px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:11px;font-weight:600;cursor:pointer}
    .cat-item .ico{font-size:22px;margin-bottom:4px}
    .ex-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px;display:flex;gap:10px}
    .avatar{width:60px;height:60px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:#e8e1fd}
    .ex-info{flex:1}
    .ex-name{font-weight:700;font-size:14px;margin-bottom:2px}
    .ex-cat{font-size:11px;color:var(--primary);font-weight:600}
    .star{color:#f4a800}
    .tabbar{display:flex;background:#fff;border-top:1px solid var(--line)}
    .tab{flex:1;text-align:center;padding:10px 4px;font-size:11px;color:#9a93ad}
    .tab.on{color:#6242e8;font-weight:700}

    /* ── annotation panel ── */
    .anno-wrap{display:flex;flex-direction:column;gap:12px}
    .anno-section{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .anno-head{background:#f5f2ff;padding:9px 12px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);color:#4432aa;display:flex;align-items:center;gap:6px}
    .anno-items{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
    .anno-item{display:flex;gap:8px;align-items:flex-start}
    .anno-num{min-width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;flex-shrink:0}
    .anno-body{flex:1}
    .anno-label{font-weight:700;font-size:13px;margin-bottom:2px}
    .anno-desc{font-size:12px;color:#4a4460;line-height:1.55}
    .anno-note{display:inline-block;background:var(--anno);border:1px solid var(--annoBorder);border-radius:6px;color:var(--annoText);font-size:11px;padding:3px 7px;margin-top:3px}
    .ux-box{background:#f0fff8;border:1px solid #9fe8c7;border-radius:10px;padding:9px 11px;margin-top:4px;font-size:12px;color:#0a6640}
    .tech-box{background:#f0f4ff;border:1px solid #b0c4ff;border-radius:10px;padding:9px 11px;margin-top:4px;font-size:12px;color:#1a3a8a}

    .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}
    .legend-item{display:flex;gap:5px;align-items:center;font-size:12px}
    .dot{width:12px;height:12px;border-radius:3px}

    @media(max-width:980px){.layout{grid-template-columns:1fr}.view{grid-template-columns:1fr}.phone{margin:0 auto}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <span class="badge">기획 와이어프레임 v4 · 한국어 주석 포함</span>
      <h1>K-Experience 매칭 플랫폼 — 화면 설계서</h1>
    </div>

  </div>

  <div class="legend">
    <div class="legend-item"><div class="dot" style="background:#7253f4"></div> UI 컴포넌트</div>
    <div class="legend-item"><div class="dot" style="background:#fff9e6;border:1px solid #f0d060"></div> 기획 의도</div>
    <div class="legend-item"><div class="dot" style="background:#f0fff8;border:1px solid #9fe8c7"></div> UX 원칙</div>
    <div class="legend-item"><div class="dot" style="background:#f0f4ff;border:1px solid #b0c4ff"></div> 개발 참고</div>

  <div class="layout" style="margin-top:10px">
    <aside class="panel">
      <div style="font-weight:700;margin-bottom:8px;font-size:14px">📋 화면 목록</div>
      <nav class="flows" id="flows"></nav>
      <div style="margin-top:12px;padding:10px;background:#f8f5ff;border-radius:10px;font-size:12px;color:#4a3888">
        <b>🎯 프로젝트 한 줄 정의</b><br/>

      </div>
    </aside>
    <section class="panel" id="main"></section>
  </div>
</div>

  {id:2,name:'イ・ジュン',nameKr:'이준',cat:'K-POPダンス',catJp:'ダンス',ico:'💃',rating:'5.0',reviews:89,area:'弘大',price:'¥12,000',lang:'JP·KR',avatar:'🕺'},

{id:'home',title:'1) 홈 화면',

phoneHtml:`

const flows=document.getElementById('flows'), main=document.getElementById('main');
function annoHtml(a){
  let h=`<div class='anno-item'><div class='anno-num'>${a.n}</div><div class='anno-body'><div class='anno-label'>${a.label}</div><div class='anno-desc'>${a.desc}</div>`;
  if(a.note) h+=`<span class='anno-note'>📌 ${a.note}</span>`;
  if(a.ux) h+=`<div class='ux-box'>💚 UX 원칙: ${a.ux}</div>`;
  if(a.tech) h+=`<div class='tech-box'>🔧 개발 참고: ${a.tech}</div>`;
  h+=`</div></div>`;
  return h;
}
function render(id){
  const s=screens.find(x=>x.id===id)||screens[0];
  flows.innerHTML=screens.map(x=>`<a href='#${x.id}' class='${x.id===s.id?'on':''}'>${x.title}</a>`).join('');
  main.innerHTML=`<div class='view'>
    <div class='phone'>
      <div class='status'><span>9:41</span><span>5G 🔋</span></div>
      <div class='screen'>${s.phoneHtml}</div>
      <div class='tabbar'>
        <div class='tab ${s.tab==='home'||s.tab==='list'?'on':''}'>🏠 ホーム</div>
        <div class='tab ${s.tab==='profile'?'on':''}'>👤 プロフィール</div>
        <div class='tab ${s.tab==='booking'?'on':''}'>📅 予約</div>
        <div class='tab ${s.tab==='chat'?'on':''}'>💬 相談</div>
        <div class='tab ${s.tab==='mypage'?'on':''}'>⚙️ マイページ</div>
      </div>
    </div>
    <div class='anno-wrap'>
      <div class='anno-section'>
        <div class='anno-head'>📝 화면 설명 — ${s.title}</div>
        <div class='anno-items'>${s.anno.map(a=>annoHtml(a)).join('')}</div>
      </div>
    </div>
  </div>`;
}
window.addEventListener('hashchange',()=>render(location.hash.slice(1)));
render(location.hash.slice(1)||'home');
