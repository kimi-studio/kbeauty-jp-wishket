    <text x="68" y="418" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1917">お支払い方法</text>
    <text x="388" y="418" font-family="system-ui" font-size="14" fill="#78716C" text-anchor="end">→</text>
    <line x1="36" y1="432" x2="394" y2="432" stroke="#E7E5E4"/>
  </g>

  <g id="menu-4">
