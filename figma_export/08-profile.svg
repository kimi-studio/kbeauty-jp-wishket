  <text x="215" y="180" font-size="40" text-anchor="middle">👤</text>
  <text x="215" y="238" font-family="system-ui" font-size="20" font-weight="700" fill="#1C1917" text-anchor="middle">ゆりか</text>
  <text x="215" y="258" font-family="system-ui" font-size="14" fill="#78716C" text-anchor="middle">yurika@example.com</text>

  <!-- Account Menu Card -->
  <rect x="20" y="288" width="390" height="196" rx="16" fill="white" stroke="#E7E5E4"/>

  <g id="menu-1">
    <text x="36" y="322" font-size="20">📅</text>
    <text x="68" y="322" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1917">予約履歴</text>
    <text x="388" y="322" font-family="system-ui" font-size="14" fill="#78716C" text-anchor="end">→</text>
    <line x1="36" y1="336" x2="394" y2="336" stroke="#E7E5E4"/>
  </g>

  <g id="menu-2">
    <text x="36" y="370" font-size="20">♡</text>
    <text x="68" y="370" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1917">お気に入り</text>
    <text x="388" y="370" font-family="system-ui" font-size="14" fill="#78716C" text-anchor="end">→</text>
