    <text x="43" y="918" font-family="system-ui" font-size="11" font-weight="600" fill="#78716C" text-anchor="middle">ホーム</text>
  </g>

  <g id="nav-search">
    <text x="129" y="892" font-size="22" text-anchor="middle">🔍</text>
    <text x="129" y="918" font-family="system-ui" font-size="11" font-weight="600" fill="#78716C" text-anchor="middle">探す</text>
  </g>

