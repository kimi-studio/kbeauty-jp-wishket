    <text x="68" y="466" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1917">言語設定</text>
    <text x="334" y="466" font-family="system-ui" font-size="13" fill="#78716C" text-anchor="end">日本語</text>
    <text x="388" y="466" font-family="system-ui" font-size="14" fill="#78716C" text-anchor="end">→</text>
  </g>

