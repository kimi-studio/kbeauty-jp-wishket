    <text x="387" y="918" font-family="system-ui" font-size="11" font-weight="600" fill="#8B5CF6" text-anchor="middle">マイページ</text>
  </g>

  <defs>
    <linearGradient id="statusGradient" x1="0" y1="0" x2="430" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="avatarGradient" x1="175" y1="128" x2="255" y2="208">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
