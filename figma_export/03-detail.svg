  <text x="112" y="812" font-family="system-ui" font-size="16" font-weight="700" fill="#8B5CF6" text-anchor="middle">相談する</text>

  <rect x="217" y="780" width="193" height="52" rx="12" fill="#8B5CF6"/>
  <text x="313" y="812" font-family="system-ui" font-size="16" font-weight="700" fill="white" text-anchor="middle">予約する</text>

  <defs>
    <linearGradient id="statusGradient" x1="0" y1="0" x2="430" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="heroGradient" x1="0" y1="44" x2="430" y2="304">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
