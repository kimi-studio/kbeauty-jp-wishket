  <text x="36" y="680" font-family="system-ui" font-size="12" fill="#78716C">60分</text>
  <text x="360" y="672" font-family="system-ui" font-size="16" font-weight="800" fill="#8B5CF6" text-anchor="end">¥8,000</text>

  <line x1="36" y1="692" x2="394" y2="692" stroke="#E7E5E4"/>

  <text x="36" y="716" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1917">フルメイク（ヘアセット込み）</text>
