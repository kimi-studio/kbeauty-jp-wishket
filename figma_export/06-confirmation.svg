<svg width="430" height="932" viewBox="0 0 430 932" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Status Bar -->
  <rect width="430" height="44" fill="url(#statusGradient)"/>
  <text x="20" y="29" font-family="system-ui" font-size="14" font-weight="500" fill="white">9:41</text>
  <text x="370" y="29" font-family="system-ui" font-size="14" font-weight="500" fill="white">5G 🔋</text>

  <!-- Content -->
  <rect y="44" width="430" height="888" fill="#FAFAF9"/>

  <!-- Success Icon -->
  <text x="215" y="164" font-size="80" text-anchor="middle">✅</text>

  <!-- Success Title -->
  <text x="215" y="228" font-family="system-ui" font-size="24" font-weight="800" fill="#1C1917" text-anchor="middle">予約が確定しました！</text>

  <!-- Success Message -->
  <text x="215" y="260" font-family="system-ui" font-size="14" fill="#78716C" text-anchor="middle">予約確認メールを送信しました。</text>
  <text x="215" y="280" font-family="system-ui" font-size="14" fill="#78716C" text-anchor="middle">当日はエキスパートから連絡があります。</text>

  <!-- Booking Details Card -->
  <rect x="20" y="324" width="390" height="220" rx="16" fill="white" stroke="#E7E5E4"/>
  <text x="36" y="352" font-size="16">📅</text>
  <text x="60" y="352" font-family="system-ui" font-size="16" font-weight="700" fill="#1C1917">予約内容</text>

  <!-- Details -->
  <g id="booking-details">
    <text x="36" y="384" font-family="system-ui" font-size="13" fill="#78716C">予約番号</text>
    <text x="360" y="384" font-family="system-ui" font-size="14" font-weight="600" fill="#8B5CF6" text-anchor="end">#KE20260415-1234</text>
    <line x1="36" y1="396" x2="394" y2="396" stroke="#E7E5E4"/>

    <text x="36" y="420" font-family="system-ui" font-size="13" fill="#78716C">エキスパート</text>
    <text x="360" y="420" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1917" text-anchor="end">キム・ミンジ</text>
    <line x1="36" y1="432" x2="394" y2="432" stroke="#E7E5E4"/>

    <text x="36" y="456" font-family="system-ui" font-size="13" fill="#78716C">日時</text>
    <text x="360" y="456" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1917" text-anchor="end">4月15日 11:00</text>
    <line x1="36" y1="468" x2="394" y2="468" stroke="#E7E5E4"/>

    <text x="36" y="492" font-family="system-ui" font-size="13" fill="#78716C">場所</text>
    <text x="360" y="492" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1917" text-anchor="end">明洞エリア</text>
    <line x1="36" y1="504" x2="394" y2="504" stroke="#E7E5E4"/>

    <text x="36" y="528" font-family="system-ui" font-size="13" fill="#78716C">合計金額</text>
    <text x="360" y="528" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1917" text-anchor="end">¥8,800</text>
  </g>

  <!-- View Booking Button -->
  <rect x="20" y="568" width="390" height="52" rx="12" fill="#8B5CF6"/>
  <text x="215" y="600" font-family="system-ui" font-size="16" font-weight="700" fill="white" text-anchor="middle">予約を確認する</text>

  <!-- Home Button -->
  <rect x="20" y="632" width="390" height="52" rx="12" fill="white" stroke="#8B5CF6" stroke-width="2"/>
  <text x="215" y="664" font-family="system-ui" font-size="16" font-weight="700" fill="#8B5CF6" text-anchor="middle">ホームに戻る</text>

  <defs>
    <linearGradient id="statusGradient" x1="0" y1="0" x2="430" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
</svg>
