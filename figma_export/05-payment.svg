<svg width="430" height="932" viewBox="0 0 430 932" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Status Bar -->
  <rect width="430" height="44" fill="url(#statusGradient)"/>
  <text x="20" y="29" font-family="system-ui" font-size="14" font-weight="500" fill="white">9:41</text>
  <text x="370" y="29" font-family="system-ui" font-size="14" font-weight="500" fill="white">5G 🔋</text>

  <!-- Navigation Bar -->
  <rect y="44" width="430" height="64" fill="white" opacity="0.95"/>
  <line x1="0" y1="108" x2="430" y2="108" stroke="#E7E5E4"/>
  <text x="24" y="73" font-size="20">←</text>
  <text x="70" y="73" font-family="system-ui" font-size="20" font-weight="700" fill="#1C1917">お支払い</text>
  <text x="70" y="93" font-family="system-ui" font-size="13" fill="#78716C">ステップ 3/3</text>

  <!-- Content -->
  <rect y="108" width="430" height="824" fill="#FAFAF9"/>

  <!-- Progress Steps -->
  <rect x="20" y="128" width="122" height="4" rx="2" fill="#10B981"/>
  <rect x="150" y="128" width="122" height="4" rx="2" fill="#10B981"/>
  <rect x="280" y="128" width="122" height="4" rx="2" fill="#8B5CF6"/>

  <!-- Payment Summary Card -->
  <rect x="20" y="156" width="390" height="140" rx="16" fill="#FAF5FF" stroke="#E9D5FF"/>
  <text x="215" y="184" font-family="system-ui" font-size="14" fill="#78716C" text-anchor="middle">お支払い金額</text>
  <text x="215" y="228" font-family="system-ui" font-size="32" font-weight="800" fill="#8B5CF6" text-anchor="middle">¥8,800</text>

  <line x1="36" y1="248" x2="394" y2="248" stroke="#E9D5FF" stroke-width="2"/>

  <text x="215" y="270" font-family="system-ui" font-size="12" fill="#78716C" text-anchor="middle">キム・ミンジ • ナチュラルメイク</text>
  <text x="215" y="286" font-family="system-ui" font-size="12" fill="#78716C" text-anchor="middle">4月15日（火）11:00 • 明洞</text>

  <!-- Payment Methods Card -->
  <rect x="20" y="320" width="390" height="236" rx="16" fill="white" stroke="#E7E5E4"/>
  <text x="36" y="344" font-size="16">💳</text>
  <text x="60" y="344" font-family="system-ui" font-size="16" font-weight="700" fill="#1C1917">お支払い方法</text>

  <!-- Credit Card Button -->
  <rect x="36" y="364" width="358" height="48" rx="12" fill="#8B5CF6"/>
  <text x="215" y="393" font-family="system-ui" font-size="16" font-weight="700" fill="white" text-anchor="middle">クレジットカードで支払う</text>

  <!-- Apple Pay Button -->
  <rect x="36" y="424" width="358" height="48" rx="12" fill="white" stroke="#8B5CF6" stroke-width="2"/>
  <text x="215" y="453" font-family="system-ui" font-size="16" font-weight="700" fill="#8B5CF6" text-anchor="middle">Apple Pay</text>

  <!-- Google Pay Button -->
  <rect x="36" y="484" width="358" height="48" rx="12" fill="white" stroke="#8B5CF6" stroke-width="2"/>
  <text x="215" y="513" font-family="system-ui" font-size="16" font-weight="700" fill="#8B5CF6" text-anchor="middle">Google Pay</text>

  <!-- Security Banner -->
  <rect x="20" y="580" width="390" height="64" rx="12" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="36" y="604" font-family="system-ui" font-size="13" font-weight="700" fill="#065F46">✓ 安全な決済</text>
  <text x="36" y="622" font-family="system-ui" font-size="13" fill="#065F46">すべての決済情報は暗号化され、</text>
  <text x="36" y="638" font-family="system-ui" font-size="13" fill="#065F46">安全に処理されます。</text>

  <!-- Terms Text -->
  <text x="215" y="680" font-family="system-ui" font-size="12" fill="#78716C" text-anchor="middle">支払いを完了すると、利用規約と</text>
  <text x="215" y="698" font-family="system-ui" font-size="12" fill="#78716C" text-anchor="middle">キャンセルポリシーに同意したことになります。</text>

  <defs>
    <linearGradient id="statusGradient" x1="0" y1="0" x2="430" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
</svg>
