<svg width="430" height="932" viewBox="0 0 430 932" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Status Bar -->
  <rect width="430" height="44" fill="url(#statusGradient)"/>
  <text x="20" y="29" font-family="system-ui" font-size="14" font-weight="500" fill="white">9:41</text>
  <text x="370" y="29" font-family="system-ui" font-size="14" font-weight="500" fill="white">5G 🔋</text>

  <!-- Navigation Bar -->
  <rect y="44" width="430" height="64" fill="white" opacity="0.95"/>
  <line x1="0" y1="108" x2="430" y2="108" stroke="#E7E5E4"/>
  <text x="20" y="85" font-family="system-ui" font-size="20" font-weight="700" fill="#1C1917">マイ予約</text>
  <text x="390" y="85" font-size="20">🔔</text>

  <!-- Content -->
  <rect y="108" width="430" height="824" fill="#FAFAF9"/>

  <!-- Section Title -->
  <text x="20" y="144" font-family="system-ui" font-size="18" font-weight="700" fill="#1C1917">次の予約</text>

  <!-- Upcoming Booking Card -->
  <rect x="20" y="160" width="390" height="172" rx="16" fill="url(#heroGradient)"/>

  <!-- Date/Time -->
  <text x="36" y="188" font-family="system-ui" font-size="12" fill="white" opacity="0.9">4月15日（火）</text>
  <text x="36" y="216" font-family="system-ui" font-size="20" font-weight="800" fill="white">11:00 - 12:00</text>

  <!-- Status Badge -->
  <rect x="310" y="176" width="68" height="28" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="344" y="196" font-family="system-ui" font-size="12" font-weight="600" fill="white" text-anchor="middle">確定済み</text>

  <!-- Separator -->
  <line x1="36" y1="232" x2="394" y2="232" stroke="rgba(255,255,255,0.2)"/>

  <!-- Service Info -->
  <text x="88" y="256" font-size="36">💄</text>
  <text x="128" y="258" font-family="system-ui" font-size="14" font-weight="700" fill="white">ナチュラルメイク</text>
  <text x="128" y="276" font-family="system-ui" font-size="13" fill="white" opacity="0.9">キム・ミンジ • 明洞</text>

  <!-- Action Buttons -->
  <rect x="36" y="292" width="175" height="32" rx="8" fill="rgba(255,255,255,0.9)"/>
  <text x="123" y="312" font-family="system-ui" font-size="13" font-weight="600" fill="#8B5CF6" text-anchor="middle">詳細を見る</text>

  <rect x="219" y="292" width="175" height="32" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="306" y="312" font-family="system-ui" font-size="13" font-weight="600" fill="white" text-anchor="middle">チャット</text>

  <!-- Past Bookings Section -->
  <text x="20" y="380" font-family="system-ui" font-size="18" font-weight="700" fill="#1C1917">過去の予約</text>

  <!-- Past Booking Card 1 -->
  <rect x="20" y="396" width="390" height="112" rx="16" fill="white" stroke="#E7E5E4"/>
  <rect x="36" y="412" width="72" height="72" rx="12" fill="url(#avatarGradient)" stroke="#E7E5E4" stroke-width="2"/>
  <text x="72" y="458" font-size="36" text-anchor="middle">💃</text>
  <text x="120" y="430" font-family="system-ui" font-size="16" font-weight="700" fill="#1C1917">イ・ジュン</text>
  <text x="120" y="448" font-family="system-ui" font-size="13" font-weight="600" fill="#8B5CF6">K-POPダンスレッスン</text>
  <text x="120" y="464" font-family="system-ui" font-size="12" fill="#78716C">3月20日 • 完了</text>

  <line x1="36" y1="496" x2="394" y2="496" stroke="#E7E5E4"/>
  <rect x="270" y="506" width="124" height="28" rx="12" fill="white" stroke="#8B5CF6" stroke-width="2"/>
  <text x="332" y="525" font-family="system-ui" font-size="13" font-weight="700" fill="#8B5CF6" text-anchor="middle">レビューを書く</text>

  <!-- Past Booking Card 2 -->
  <rect x="20" y="524" width="390" height="112" rx="16" fill="white" stroke="#E7E5E4"/>
  <rect x="36" y="540" width="72" height="72" rx="12" fill="url(#avatarGradient)" stroke="#E7E5E4" stroke-width="2"/>
  <text x="72" y="586" font-size="36" text-anchor="middle">🎨</text>
  <text x="120" y="558" font-family="system-ui" font-size="16" font-weight="700" fill="#1C1917">パク・ソヒ</text>
  <text x="120" y="576" font-family="system-ui" font-size="13" font-weight="600" fill="#8B5CF6">パーソナルカラー診断</text>
  <text x="120" y="592" font-family="system-ui" font-size="12" fill="#78716C">2月10日 • 完了</text>

  <line x1="36" y1="624" x2="394" y2="624" stroke="#E7E5E4"/>
  <text x="304" y="641" font-size="13" fill="#10B981">✓</text>
  <text x="320" y="641" font-family="system-ui" font-size="13" font-weight="600" fill="#10B981">レビュー済み</text>

  <!-- Bottom Navigation -->
  <rect y="868" width="430" height="64" fill="white"/>
  <line x1="0" y1="868" x2="430" y2="868" stroke="#E7E5E4"/>

  <g id="nav-home">
    <text x="43" y="892" font-size="22" text-anchor="middle">🏠</text>
    <text x="43" y="918" font-family="system-ui" font-size="11" font-weight="600" fill="#78716C" text-anchor="middle">ホーム</text>
  </g>

  <g id="nav-search">
    <text x="129" y="892" font-size="22" text-anchor="middle">🔍</text>
    <text x="129" y="918" font-family="system-ui" font-size="11" font-weight="600" fill="#78716C" text-anchor="middle">探す</text>
  </g>

  <g id="nav-bookings">
    <text x="215" y="892" font-size="22" text-anchor="middle">📅</text>
    <text x="215" y="918" font-family="system-ui" font-size="11" font-weight="600" fill="#8B5CF6" text-anchor="middle">予約</text>
  </g>

  <g id="nav-chat">
    <text x="301" y="892" font-size="22" text-anchor="middle">💬</text>
    <text x="301" y="918" font-family="system-ui" font-size="11" font-weight="600" fill="#78716C" text-anchor="middle">チャット</text>
  </g>

  <g id="nav-profile">
    <text x="387" y="892" font-size="22" text-anchor="middle">👤</text>
    <text x="387" y="918" font-family="system-ui" font-size="11" font-weight="600" fill="#78716C" text-anchor="middle">マイページ</text>
  </g>

  <defs>
    <linearGradient id="statusGradient" x1="0" y1="0" x2="430" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="heroGradient" x1="20" y1="160" x2="410" y2="332">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="avatarGradient" x1="0" y1="0" x2="72" y2="72">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
  </defs>
</svg>
