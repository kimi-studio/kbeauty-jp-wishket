<svg width="430" height="932" viewBox="0 0 430 932" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Status Bar -->
  <rect width="430" height="44" fill="url(#statusGradient)"/>
  <text x="20" y="29" font-family="system-ui" font-size="14" font-weight="500" fill="white">9:41</text>
  <text x="370" y="29" font-family="system-ui" font-size="14" font-weight="500" fill="white">5G 🔋</text>

  <!-- Navigation Bar -->
  <rect y="44" width="430" height="64" fill="white" opacity="0.95"/>
  <line x1="0" y1="108" x2="430" y2="108" stroke="#E7E5E4"/>
  <text x="24" y="73" font-size="20">←</text>
  <text x="70" y="73" font-family="system-ui" font-size="20" font-weight="700" fill="#1C1917">予約する</text>
  <text x="70" y="93" font-family="system-ui" font-size="13" fill="#78716C">ステップ 1/3</text>

  <!-- Content -->
  <rect y="108" width="430" height="824" fill="#FAFAF9"/>

  <!-- Progress Steps -->
  <rect x="20" y="128" width="122" height="4" rx="2" fill="#8B5CF6"/>
  <rect x="150" y="128" width="122" height="4" rx="2" fill="#E7E5E4"/>
  <rect x="280" y="128" width="122" height="4" rx="2" fill="#E7E5E4"/>

  <!-- Booking Summary Card -->
  <rect x="20" y="156" width="390" height="68" rx="16" fill="#FAF5FF" stroke="#E9D5FF"/>
  <text x="64" y="186" font-size="36">💄</text>
  <text x="112" y="184" font-family="system-ui" font-size="14" font-weight="700" fill="#1C1917">キム・ミンジ</text>
  <text x="112" y="204" font-family="system-ui" font-size="13" fill="#78716C">ナチュラルメイク（60分）</text>

  <!-- Date Selection -->
  <text x="20" y="256" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1917">日付を選択</text>
  <rect x="20" y="264" width="390" height="48" rx="12" fill="white" stroke="#E7E5E4" stroke-width="2"/>
  <text x="36" y="293" font-family="system-ui" font-size="15" fill="#1C1917">2026-04-15</text>

  <!-- Time Selection -->
  <text x="20" y="344" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1917">時間を選択</text>
  <g id="time-chips">
    <rect x="20" y="352" width="70" height="40" rx="10" fill="white" stroke="#E7E5E4" stroke-width="2"/>
    <text x="55" y="378" font-family="system-ui" font-size="13" font-weight="600" fill="#1C1917" text-anchor="middle">10:00</text>

    <rect x="98" y="352" width="70" height="40" rx="10" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2"/>
    <text x="133" y="378" font-family="system-ui" font-size="13" font-weight="600" fill="#8B5CF6" text-anchor="middle">11:00</text>

    <rect x="176" y="352" width="70" height="40" rx="10" fill="white" stroke="#E7E5E4" stroke-width="2"/>
    <text x="211" y="378" font-family="system-ui" font-size="13" font-weight="600" fill="#1C1917" text-anchor="middle">13:00</text>

    <rect x="254" y="352" width="70" height="40" rx="10" fill="white" stroke="#E7E5E4" stroke-width="2"/>
    <text x="289" y="378" font-family="system-ui" font-size="13" font-weight="600" fill="#1C1917" text-anchor="middle">14:00</text>

    <rect x="332" y="352" width="70" height="40" rx="10" fill="white" stroke="#E7E5E4" stroke-width="2"/>
    <text x="367" y="378" font-family="system-ui" font-size="13" font-weight="600" fill="#1C1917" text-anchor="middle">15:00</text>
  </g>

  <!-- Number of People -->
  <text x="20" y="424" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1917">人数</text>
  <rect x="20" y="432" width="185" height="40" rx="10" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="112" y="458" font-family="system-ui" font-size="13" font-weight="600" fill="#8B5CF6" text-anchor="middle">1名</text>

  <rect x="217" y="432" width="193" height="40" rx="10" fill="white" stroke="#E7E5E4" stroke-width="2"/>
  <text x="313" y="458" font-family="system-ui" font-size="13" font-weight="600" fill="#1C1917" text-anchor="middle">2名</text>

  <!-- Info Banner -->
  <rect x="20" y="516" width="390" height="76" rx="12" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="36" y="542" font-family="system-ui" font-size="13" font-weight="700" fill="#92400E">📌 予約について</text>
  <text x="36" y="562" font-family="system-ui" font-size="13" fill="#92400E">この時点ではまだ予約は確定されません。</text>
  <text x="36" y="580" font-family="system-ui" font-size="13" fill="#92400E">次のステップで内容を確認してください。</text>

  <!-- Submit Button -->
  <rect x="20" y="616" width="390" height="52" rx="12" fill="#8B5CF6"/>
  <text x="215" y="648" font-family="system-ui" font-size="16" font-weight="700" fill="white" text-anchor="middle">次へ（内容確認）</text>

  <defs>
    <linearGradient id="statusGradient" x1="0" y1="0" x2="430" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
</svg>
